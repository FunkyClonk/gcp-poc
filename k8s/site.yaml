apiVersion: v1
kind: ConfigMap
metadata:
  name: site-html
  namespace: demo-site
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="fr">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Mon site sur GKE</title>
      <style>
        body {
          font-family: system-ui, sans-serif;
          background: #101827;
          color: #f8fafc;
          min-height: 100vh;
          display: grid;
          place-items: center;
          margin: 0;
        }
        main { text-align: center; padding: 2rem; }
        h1 { color: #60a5fa; }
        p { color: #cbd5e1; }
      </style>
    </head>
    <body>
      <main>
        <h1>Mon site fonctionne !</h1>
        <p>Déployé avec Terraform, GKE et Kubernetes.</p>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: demo-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: site-content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: site-content
          configMap:
            name: site-html
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: demo-site
spec:
  type: LoadBalancer
  selector:
    app: website
  ports:
    - port: 80
      targetPort: 80